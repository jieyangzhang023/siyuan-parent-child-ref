name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin.json version
        run: |
          version=$(jq -r .version plugin.json)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin.json version v$version" >&2
            exit 1
          fi

      - name: Package
        run: zip -r package.zip icon.png preview.png index.js plugin.json README.md i18n

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" package.zip --title "${GITHUB_REF_NAME}" --generate-notes
